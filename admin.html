<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — Base Completa</title>

  <script>
    (function guardiaAdmin() {
      const usuario = localStorage.getItem('usuario');
      const perfil = localStorage.getItem('perfil');

      if (!usuario || perfil !== 'admin') {
        window.location.replace('index.html');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="modalTexto" class="modal-texto" onclick="cerrarModal(event)">
    <div class="modal-contenido" onclick="event.stopPropagation()">
      <h4 id="modalTitulo"></h4>
      <p id="modalTextoContenido"></p>
      <button class="btn-cerrar-modal" style="background:#2e7d32; color:white; border:none; padding:8px 20px; border-radius:4px; cursor:pointer;" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <div class="contenedor">
    <header>
      <h1>⚙️ Gestión Completa (Admin - Google Drive Sync)</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button onclick="descargarExcel()" class="descargar" style="background:#1565c0;">📥 Descargar Base Completa</button>
        <button onclick="cerrarSesion()" class="salir">Salir</button>
      </div>
    </header>

    <section class="carga-excel">
      <h3>📤 Cargar / Integrar Nuevas Tareas al Drive</h3>
      <p style="font-size: 12px; color: #666; margin-bottom: 8px;">
        Nota: La base de datos ya está guardada permanentemente en Google Drive. Usa este botón solo si deseas integrar nuevas tareas a las existentes.
      </p>
      <input type="file" id="archivoBase" accept=".xlsx">
      <button onclick="subirArchivo('base')">Subir e Integrar</button>
    </section>

    <!-- MENÚ DE PESTAÑAS -->
    <div class="tabs-menu">
      <button class="tab-btn activo" id="btnTabPendientes" onclick="cambiarTab('pendientes')">⏳ Pendientes Hoy/Ayer (<span id="countPendientes">0</span>)</button>
      <button class="tab-btn" id="btnTabGestionados" onclick="cambiarTab('gestionados')">✅ Gestionadas Hoy/Ayer (<span id="countGestionados">0</span>)</button>
      <button class="tab-btn" id="btnTabAntiguos" onclick="cambiarTab('antiguos')">📦 Antiguos (<span id="countAntiguos">0</span>)</button>
    </div>

    <!-- PESTAÑA PENDIENTES -->
    <div id="tabPendientes" class="tab-contenido activo">
      <div style="margin-bottom: 10px;">
        <button id="btnGuardarSeleccionados" onclick="guardarSeleccionados()" style="background:#2e7d32; font-weight:bold;">
          💾 Guardar Seleccionados como Gestionado
        </button>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr id="encabezadoPendientes"></tr>
          </thead>
          <tbody id="cuerpoTablaPendientes"></tbody>
        </table>
      </div>
    </div>

    <!-- PESTAÑA GESTIONADOS -->
    <div id="tabGestionados" class="tab-contenido">
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr id="encabezadoGestionados"></tr>
          </thead>
          <tbody id="cuerpoTablaGestionados"></tbody>
        </table>
      </div>
    </div>

    <!-- PESTAÑA ANTIGUOS -->
    <div id="tabAntiguos" class="tab-contenido">
      <div style="margin-bottom: 10px;">
        <button id="btnGuardarAntiguos" onclick="guardarSeleccionados()" style="background:#2e7d32; font-weight:bold;">
          💾 Guardar Seleccionados como Gestionado
        </button>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr id="encabezadoAntiguos"></tr>
          </thead>
          <tbody id="cuerpoTablaAntiguos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const URL_BACKEND = 'https://confirmacion-previa-backend.onrender.com';
    const usuarioLogeado = localStorage.getItem('usuario') || 'Admin';
    let todosLosDatos = [];
    let listas = { observaciones: [] };
    let filtrosPendientes = {};
    let filtrosGestionados = {};
    let filtrosAntiguos = {};

    const columnas = [
      { clave: 'TAREA', nombre: 'TAREA' },
      { clave: 'ORDEN', nombre: 'ORDEN' },
      { clave: 'CIUDAD', nombre: 'CIUDAD' },
      { clave: 'TECNICO', nombre: 'TÉCNICO' },
      { clave: 'CONTRATO', nombre: 'CONTRATO' },
      { clave: 'CLIENTE', nombre: 'CLIENTE' },
      { clave: 'FECHA DE PROGRAMACIÓN', nombre: 'Fecha Prog.' },
      { clave: 'Operador', nombre: 'Operador' },
      { clave: 'Fecha de Registro', nombre: 'Fecha Registro' },
      { clave: 'Observacion', nombre: 'Observación' },
      { clave: 'ACCION', nombre: '✓' }
    ];

    async function cargarDatos() {
      try {
        const [resDatos, resListas] = await Promise.all([
          fetch(`${URL_BACKEND}/api/datos?perfil=admin`),
          fetch(`${URL_BACKEND}/api/listas`)
        ]);
        
        todosLosDatos = await resDatos.json();
        listas = await resListas.json();

        generarEncabezados('encabezadoPendientes', 'pendientes');
        generarEncabezados('encabezadoGestionados', 'gestionados');
        generarEncabezados('encabezadoAntiguos', 'antiguos');
        renderizarTablas();
      } catch (e) {
        console.error('Error al cargar datos:', e);
      }
    }

    function cambiarTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('activo'));
      document.querySelectorAll('.tab-contenido').forEach(cont => cont.classList.remove('activo'));

      if (tab === 'pendientes') {
        document.getElementById('btnTabPendientes').classList.add('activo');
        document.getElementById('tabPendientes').classList.add('activo');
      } else if (tab === 'gestionados') {
        document.getElementById('btnTabGestionados').classList.add('activo');
        document.getElementById('tabGestionados').classList.add('activo');
      } else {
        document.getElementById('btnTabAntiguos').classList.add('activo');
        document.getElementById('tabAntiguos').classList.add('activo');
      }
    }

    function generarEncabezados(idFila, tipo) {
      const tr = document.getElementById(idFila);
      tr.innerHTML = '';
      
      columnas.forEach(col => {
        const th = document.createElement('th');
        if (col.clave === 'ACCION') {
          if (tipo === 'pendientes' || tipo === 'antiguos') {
            th.innerHTML = `<input type="checkbox" onchange="toggleSeleccionarTodos(this, '${tipo}')">`;
          } else {
            th.textContent = '✓';
          }
        } else {
          th.innerHTML = `
            ${col.nombre}
            <input type="text" class="filtro-columna" placeholder="Filtrar..." 
                   data-clave="${col.clave}" data-tipo="${tipo}" onkeyup="filtrarTabla(event)">
          `;
        }
        tr.appendChild(th);
      });
    }

    function toggleSeleccionarTodos(chkMaster, tipo) {
      const idCuerpo = tipo === 'pendientes' ? '#cuerpoTablaPendientes' : '#cuerpoTablaAntiguos';
      document.querySelectorAll(`${idCuerpo} .chk-tarea:not(:disabled)`).forEach(chk => {
        chk.checked = chkMaster.checked;
      });
    }

    function filtrarTabla(event) {
      const input = event.target;
      const clave = input.dataset.clave;
      const tipo = input.dataset.tipo;
      const valor = input.value.toLowerCase();

      if (tipo === 'pendientes') {
        filtrosPendientes[clave] = valor;
      } else if (tipo === 'gestionados') {
        filtrosGestionados[clave] = valor;
      } else {
        filtrosAntiguos[clave] = valor;
      }
      renderizarTablas();
    }

    function aplicarFiltroArray(datos, filtros) {
      return datos.filter(d => {
        return Object.keys(filtros).every(clave => {
          if (!filtros[clave]) return true;
          return aTexto(d[clave]).toLowerCase().includes(filtros[clave]);
        });
      });
    }

    function esHoyOAyer(fechaStr) {
      if (!fechaStr) return false;
      const f = new Date(fechaStr);
      if (isNaN(f.getTime())) return true;
      
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const ayer = new Date(hoy);
      ayer.setDate(ayer.getDate() - 1);

      const fechaComparable = new Date(f.getFullYear(), f.getMonth(), f.getDate());
      return fechaComparable.getTime() >= ayer.getTime();
    }

    function renderizarTablas() {
      const recientes = todosLosDatos.filter(d => esHoyOAyer(d['FECHA DE PROGRAMACIÓN'] || d['Fecha de Registro']));
      const antiguos = todosLosDatos.filter(d => !esHoyOAyer(d['FECHA DE PROGRAMACIÓN'] || d['Fecha de Registro']));

      const recientesLimitados = recientes.slice(0, 200);

      let pendientes = recientesLimitados.filter(d => {
        const obs = (d.Observacion || '').toString().trim().toLowerCase();
        return !obs || obs === 'pendiente' || obs === '-- seleccionar --';
      });

      let gestionados = recientesLimitados.filter(d => {
        const obs = (d.Observacion || '').toString().trim().toLowerCase();
        return obs && obs !== 'pendiente' && obs !== '-- seleccionar --';
      });

      document.getElementById('countPendientes').textContent = pendientes.length;
      document.getElementById('countGestionados').textContent = gestionados.length;
      document.getElementById('countAntiguos').textContent = antiguos.length;

      pendientes = aplicarFiltroArray(pendientes, filtrosPendientes);
      gestionados = aplicarFiltroArray(gestionados, filtrosGestionados);
      const antiguosFiltrados = aplicarFiltroArray(antiguos, filtrosAntiguos);

      renderizarCuerpo('cuerpoTablaPendientes', pendientes, false);
      renderizarCuerpo('cuerpoTablaGestionados', gestionados, true);
      // Permitimos gestionar también los registros antiguos
      renderizarCuerpo('cuerpoTablaAntiguos', antiguosFiltrados, false);
    }

    function renderizarCuerpo(idCuerpo, datos, esGestionado) {
      const cuerpo = document.getElementById(idCuerpo);
      cuerpo.innerHTML = '';

      datos.forEach(d => {
        const obsLimpia = (d.Observacion || '').toString().trim();
        const esPendiente = !obsLimpia || obsLimpia.toLowerCase() === 'pendiente';

        const valorObs = esPendiente ? '' : obsLimpia;
        const valorOp = d.Operador || '';
        const valorFechaReg = d['Fecha de Registro'] || '';

        const fila = document.createElement('tr');
        const etiquetaNuevo = d.NuevoRegistro ? '<span class="nuevo-registro">Nuevo registro</span>' : '';
        const tareaLimpia = aTexto(d.TAREA).replace(/'/g, "\\'");

        const estaHabilitado = !esGestionado || esPendiente;

        fila.innerHTML = `
          <td class="texto-corto" ondblclick="mostrarModal('Tarea', '${tareaLimpia}')" title="Doble clic para ver completo">
            ${truncarTexto(d.TAREA, 12)} ${etiquetaNuevo}
          </td>
          <td class="texto-corto" ondblclick="mostrarModal('Orden', '${aTexto(d.ORDEN).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.ORDEN, 12)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Ciudad', '${aTexto(d.CIUDAD).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.CIUDAD, 18)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Técnico', '${aTexto(d.TECNICO).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.TECNICO, 15)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Contrato', '${aTexto(d.CONTRATO).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${aTexto(d.CONTRATO)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Cliente', '${aTexto(d.CLIENTE).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.CLIENTE, 18)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Fecha de Programación', '${aTexto(d['FECHA DE PROGRAMACIÓN']).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d['FECHA DE PROGRAMACIÓN'], 16)}</td>
          
          <td class="texto-corto" ondblclick="mostrarModal('Operador', '${aTexto(valorOp).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(valorOp, 15)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Fecha de Registro', '${aTexto(valorFechaReg).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(valorFechaReg, 15)}</td>
          
          <td>
            <select class="campo-editar" data-tarea="${tareaLimpia}" ${estaHabilitado ? '' : 'disabled'}>
              <option value="">-- Seleccionar --</option>
              ${listas.observaciones.map(obs => 
                `<option value="${obs}" ${valorObs === obs ? 'selected' : ''}>${obs}</option>`
              ).join('')}
            </select>
          </td>

          <td style="text-align: center;">
            <input type="checkbox" class="chk-tarea" data-tarea="${tareaLimpia}" ${estaHabilitado ? '' : 'disabled checked'}>
          </td>
        `;
        cuerpo.appendChild(fila);
      });
    }

    async function guardarSeleccionados() {
      const seleccionados = document.querySelectorAll('.chk-tarea:checked:not(:disabled)');
      if (seleccionados.length === 0) {
        return alert('Selecciona al menos una tarea para guardar.');
      }

      const listaPayload = [];
      const hoy = new Date();
      const fechaFormateada = hoy.toLocaleDateString('es-EC', { day: '2-digit', month: 'long', year: 'numeric' });

      for (let chk of seleccionados) {
        const tarea = chk.dataset.tarea;
        const selectObs = document.querySelector(`select[data-tarea="${tarea}"]`);
        const observacion = selectObs ? selectObs.value : '';

        if (!observacion) {
          alert(`La tarea "${tarea}" fue seleccionada pero no tiene una observación asignada.`);
          return;
        }

        listaPayload.push({
          tarea,
          operador: usuarioLogeado,
          observacion,
          fechaRegistro: fechaFormateada
        });
      }

      const botonesGuardar = [document.getElementById('btnGuardarSeleccionados'), document.getElementById('btnGuardarAntiguos')];
      botonesGuardar.forEach(btn => {
        if (btn) {
          btn.disabled = true;
          btn.style.opacity = '0.5';
          btn.style.cursor = 'not-allowed';
        }
      });

      try {
        const res = await fetch(`${URL_BACKEND}/api/editar`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(listaPayload)
        });

        const data = await res.json();
        alert(`✅ ${data.mensaje}`);
        cargarDatos();
      } catch (error) {
        alert('Error al guardar los registros.');
      } finally {
        botonesGuardar.forEach(btn => {
          if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
          }
        });
      }
    }

    function truncarTexto(texto, maxCaracteres = 25) {
      if (!texto) return '';
      const t = String(texto);
      return t.length > maxCaracteres ? t.substring(0, maxCaracteres) + '...' : t;
    }

    function aTexto(valor) {
      if (valor === null || valor === undefined) return '';
      return String(valor);
    }

    function mostrarModal(titulo, textoCompleto) {
      document.getElementById('modalTitulo').textContent = titulo;
      document.getElementById('modalTextoContenido').textContent = textoCompleto || '(Vacío)';
      document.getElementById('modalTexto').style.display = 'flex';
    }

    function cerrarModal(event) {
      if (!event || event.target === document.getElementById('modalTexto') || event.target.classList.contains('btn-cerrar-modal')) {
        document.getElementById('modalTexto').style.display = 'none';
      }
    }

    function descargarExcel() {
      window.location.href = `${URL_BACKEND}/api/descargar`;
    }

    async function subirArchivo(tipo) {
      const input = document.getElementById('archivoBase');
      if (!input.files[0]) return alert('Selecciona un archivo Excel');

      const form = new FormData();
      form.append('archivo', input.files[0]);
      form.append('tipo', tipo);

      const res = await fetch(`${URL_BACKEND}/api/cargar-excel`, {
        method: 'POST',
        body: form
      });
      const data = await res.json();
      alert(data.mensaje || 'Cargado');
      cargarDatos();
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.replace('index.html');
    }

    cargarDatos();
  </script>
</body>
</html>
