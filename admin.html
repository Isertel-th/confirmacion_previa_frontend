<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — Base Completa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>⚙️ Gestión Completa de Tareas</h1>
      <div style="display:flex;gap:10px;">
        <button onclick="descargarExcel()" class="descargar">📥 Descargar Base Actualizada</button>
        <button onclick="cerrarSesion()" class="salir">Salir</button>
      </div>
    </header>

    <section class="carga-excel">
      <h3>📤 Cargar Archivos</h3>
      <label>Base de Datos:</label>
      <input type="file" id="archivoBase" accept=".xlsx">
      <button onclick="subirArchivo('base')">Subir Base</button>
    </section>

    <div class="leyenda-colores">
      <span>Lotes:</span>
      <span style="background:#e3f2fd">1</span>
      <span style="background:#c8e6c9">2</span>
      <span style="background:#fff9c4">3</span>
      <span style="background:#f8bbd9">4</span>
      <span style="background:#e1bee8">5</span>
      <span style="background:#d7ccc8">6</span>
    </div>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>TAREA</th>
            <th>ORDEN</th>
            <th>CIUDAD</th>
            <th>TÉCNICO</th>
            <th>CONTRATO</th>
            <th>Cliente</th>
            <th>Fecha Programación</th>
            <th>Operador</th>
            <th>Observación</th>
            <th>Lote</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </div>

  <script>
    const URL_BACKEND = 'https://confirmacion-previa-backend.onrender.com';
    let todosLosDatos = [];

    async function cargarDatos() {
      const res = await fetch(`${URL_BACKEND}/api/datos?perfil=admin&horaInicio=${new Date().toISOString()}`);
      todosLosDatos = await res.json();
      const cuerpo = document.getElementById('cuerpoTabla');
      cuerpo.innerHTML = '';
      
      todosLosDatos.forEach(d => {
        const fila = document.createElement('tr');
        fila.style.backgroundColor = d.color;
        fila.innerHTML = `
          <td>${d.TAREA || ''}</td>
          <td>${d.ORDEN || ''}</td>
          <td>${d.CIUDAD || ''}</td>
          <td>${d.TECNICO || ''}</td>
          <td>${d.CONTRATO || ''}</td>
          <td>${d.Cliente || ''}</td>
          <td>${d['Fecha de programación desde'] || ''}</td>
          <td>${d.Operador || '-'}</td>
          <td>${d.Observacion || 'Pendiente'}</td>
          <td>${d.lote + 1}</td>
        `;
        cuerpo.appendChild(fila);
      });
    }

    async function descargarExcel() {
      window.location.href = `${URL_BACKEND}/api/descargar`;
    }

    async function subirArchivo(tipo) {
      const input = document.getElementById('archivoBase');
      if (!input.files[0]) return alert('Selecciona un archivo');
      
      const form = new FormData();
      form.append('archivo', input.files[0]);
      form.append('tipo', tipo);
      
      const res = await fetch(`${URL_BACKEND}/api/cargar-excel`, {
        method: 'POST',
        body: form
      });
      const data = await res.json();
      alert(data.mensaje || 'Cargado');
      cargarDatos();
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    cargarDatos();
  </script>
</body>
</html>
