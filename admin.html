<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — Base Completa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Modal para ver texto completo -->
  <div id="modalTexto" class="modal-texto" onclick="cerrarModal(event)">
    <div class="modal-contenido" onclick="event.stopPropagation()">
      <h4 id="modalTitulo"></h4>
      <p id="modalTextoContenido"></p>
      <button class="modal-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <div class="contenedor">
    <header>
      <h1>⚙️ Gestión Completa</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button onclick="descargarExcel()" class="descargar">📥 Descargar</button>
        <button onclick="cerrarSesion()" class="salir">Salir</button>
      </div>
    </header>
    <section class="carga-excel">
      <h3>📤 Cargar Archivos</h3>
      <label>Base de Datos:</label>
      <input type="file" id="archivoBase" accept=".xlsx">
      <button onclick="subirArchivo('base')">Subir Base</button>
    </section>
    <div class="leyenda-colores">
      <span>Lotes:</span>
      <span style="background:#e3f2fd">1</span>
      <span style="background:#c8e6c9">2</span>
      <span style="background:#fff9c4">3</span>
      <span style="background:#f8bbd9">4</span>
      <span style="background:#e1bee8">5</span>
      <span style="background:#d7ccc8">6</span>
    </div>
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>TAREA</th>
            <th>ORDEN</th>
            <th>CIUDAD</th>
            <th>TÉCNICO</th>
            <th>CONTRATO</th>
            <th>Cliente</th>
            <th>Fecha Prog.</th>
            <th>Operador</th>
            <th>Observación</th>
            <th>Lote</th>
            <th>✓</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </div>

  <script>
    const URL_BACKEND = 'https://confirmacion-previa-backend.onrender.com';
    let todosLosDatos = [];
    let listas = { operadores: [], observaciones: [] };

    async function cargarDatos() {
      const [res, resListas] = await Promise.all([
        fetch(`${URL_BACKEND}/api/datos?perfil=admin&horaInicio=${new Date().toISOString()}`),
        fetch(`${URL_BACKEND}/api/listas`)
      ]);
      
      todosLosDatos = await res.json();
      listas = await resListas.json();
      renderizarTabla(todosLosDatos);
    }

    function truncarTexto(texto, maxCaracteres = 25) {
      if (!texto) return '';
      const t = String(texto);
      return t.length > maxCaracteres ? t.substring(0, maxCaracteres) + '...' : t;
    }

    function mostrarModal(titulo, textoCompleto) {
      document.getElementById('modalTitulo').textContent = titulo;
      document.getElementById('modalTextoContenido').textContent = textoCompleto || '(Vacío)';
      document.getElementById('modalTexto').style.display = 'flex';
    }

    function cerrarModal(event) {
      if (!event || event.target === document.getElementById('modalTexto')) {
        document.getElementById('modalTexto').style.display = 'none';
      }
    }

    function renderizarTabla(datos) {
      const cuerpo = document.getElementById('cuerpoTabla');
      cuerpo.innerHTML = '';
      
      datos.forEach(d => {
        const valorObs = d.Observacion || 'Pendiente';
        const fila = document.createElement('tr');
        fila.style.backgroundColor = d.color;
        fila.innerHTML = `
          <td class="texto-corto" ondblclick="mostrarModal('Tarea', '${(d.TAREA||'').replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.TAREA, 12)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Orden', '${(d.ORDEN||'').replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.ORDEN, 12)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Ciudad', '${(d.CIUDAD||'').replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.CIUDAD, 22)}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Técnico', '${(d.TECNICO||'').replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.TECNICO, 15)}</td>
          <td class="texto-corto">${d.CONTRATO || ''}</td>
          <td class="texto-corto" ondblclick="mostrarModal('Cliente', '${(d.Cliente||'').replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.Cliente, 15)}</td>
          <td class="texto-corto">${d['Fecha de programación'] || ''}</td>
          <td>
            <select class="campo-editar" data-tarea="${d.TAREA}" data-campo="operador">
              <option value="">--</option>
              ${listas.operadores.map(op => 
                `<option ${(d.Operador || '') === op ? 'selected' : ''}>${op}</option>`
              ).join('')}
            </select>
          </td>
          <td>
            <select class="campo-editar" data-tarea="${d.TAREA}" data-campo="observacion">
              <option value="">--</option>
              ${listas.observaciones.map(obs => 
                `<option ${valorObs === obs ? 'selected' : ''}>${obs}</option>`
              ).join('')}
            </select>
          </td>
          <td style="text-align:center">${d.lote + 1}</td>
          <td><button class="guardar" data-tarea="${d.TAREA}">✓</button></td>
        `;
        cuerpo.appendChild(fila);
      });

      asignarEventosGuardado();
    }

    function asignarEventosGuardado() {
      document.querySelectorAll('.guardar').forEach(btn => {
        btn.onclick = async e => {
          const tarea = e.target.dataset.tarea;
          const operador = document.querySelector(`select[data-tarea="${tarea}"][data-campo="operador"]`).value;
          const observacion = document.querySelector(`select[data-tarea="${tarea}"][data-campo="observacion"]`).value;
          
          await fetch(`${URL_BACKEND}/api/editar`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tarea, operador, observacion })
          });
          
          alert('✅ Guardado');
        };
      });
    }

    async function descargarExcel() {
      window.location.href = `${URL_BACKEND}/api/descargar`;
    }

    async function subirArchivo(tipo) {
      const input = document.getElementById('archivoBase');
      if (!input.files[0]) return alert('Selecciona un archivo');
      
      const form = new FormData();
      form.append('archivo', input.files[0]);
      form.append('tipo', tipo);
      
      const res = await fetch(`${URL_BACKEND}/api/cargar-excel`, {
        method: 'POST',
        body: form
      });
      const data = await res.json();
      alert(data.mensaje || 'Cargado');
      cargarDatos();
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    cargarDatos();
  </script>
</body>
</html>
