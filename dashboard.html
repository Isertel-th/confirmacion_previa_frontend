<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Operador — Isertel</title>

  <script>
    (function guardiaOperador() {
      const usuario = localStorage.getItem('usuario');
      const perfil = localStorage.getItem('perfil');
      if (!usuario || !perfil) {
        window.location.replace('index.html');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toastContainer"></div>

  <div id="modalTexto" class="modal-texto" onclick="cerrarModal(event)">
    <div class="modal-contenido" onclick="event.stopPropagation()">
      <h4 id="modalTitulo"></h4>
      <p id="modalTextoContenido"></p>
      <button class="btn-cerrar-modal" style="background:var(--primary); color:white; border:none; padding:8px 20px; border-radius:6px; cursor:pointer;" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <div class="contenedor">
    <header>
      <h1>📋 Panel de Operador — Tareas Asignadas</h1>
      <button onclick="cerrarSesion()" class="salir">Salir</button>
    </header>

    <!-- MENÚ DE PESTAÑAS -->
    <div class="tabs-menu">
      <button class="tab-btn activo" id="btnTabPendientes" onclick="cambiarTab('pendientes')">⏳ Pendientes Mañana (<span id="countPendientes">0</span>)</button>
      <button class="tab-btn" id="btnTabGestionados" onclick="cambiarTab('gestionados')">✅ Gestionadas Mañana (<span id="countGestionados">0</span>)</button>
      <button class="tab-btn" id="btnTabAntiguosPendientes" onclick="cambiarTab('antiguosPendientes')">📦 Antiguos / Hoy Pendientes (<span id="countAntiguosPendientes">0</span>)</button>
      <button class="tab-btn" id="btnTabAntiguosGestionados" onclick="cambiarTab('antiguosGestionados')">📂 Antiguos / Hoy Gestionados (<span id="countAntiguosGestionados">0</span>)</button>
    </div>

    <!-- PESTAÑA PENDIENTES MAÑANA -->
    <div id="tabPendientes" class="tab-contenido activo">
      <div style="margin-bottom: 5px;">
        <button id="btnGuardarSeleccionados" onclick="guardarSeleccionados()" style="background:var(--success); font-weight:bold;">
          💾 Guardar Seleccionados como Gestionado
        </button>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead><tr id="encabezadoPendientes"></tr></thead>
          <tbody id="cuerpoTablaPendientes"></tbody>
        </table>
      </div>
    </div>

    <!-- PESTAÑA GESTIONADOS MAÑANA -->
    <div id="tabGestionados" class="tab-contenido">
      <div class="tabla-contenedor">
        <table>
          <thead><tr id="encabezadoGestionados"></tr></thead>
          <tbody id="cuerpoTablaGestionados"></tbody>
        </table>
      </div>
    </div>

    <!-- PESTAÑA ANTIGUOS / HOY PENDIENTES -->
    <div id="tabAntiguosPendientes" class="tab-contenido">
      <div style="margin-bottom: 5px;">
        <button id="btnGuardarAntiguos" onclick="guardarSeleccionados()" style="background:var(--success); font-weight:bold;">
          💾 Guardar Seleccionados como Gestionado
        </button>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead><tr id="encabezadoAntiguosPendientes"></tr></thead>
          <tbody id="cuerpoTablaAntiguosPendientes"></tbody>
        </table>
      </div>
    </div>

    <!-- PESTAÑA ANTIGUOS / HOY GESTIONADOS -->
    <div id="tabAntiguosGestionados" class="tab-contenido">
      <div class="tabla-contenedor">
        <table>
          <thead><tr id="encabezadoAntiguosGestionados"></tr></thead>
          <tbody id="cuerpoTablaAntiguosGestionados"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const URL_BACKEND = 'https://confirmacion-previa-backend.onrender.com';
    const usuarioLogeado = localStorage.getItem('usuario') || 'Operador';
    let todosLosDatos = [];
    let listas = { observaciones: [] };
    let filtrosPendientes = {};
    let filtrosGestionados = {};
    let filtrosAntiguosPendientes = {};
    let filtrosAntiguosGestionados = {};

    const columnas = [
      { clave: 'TAREA', nombre: 'TAREA' },
      { clave: 'ORDEN', nombre: 'ORDEN' },
      { clave: 'CIUDAD', nombre: 'CIUDAD' },
      { clave: 'TECNICO', nombre: 'TÉCNICO' },
      { clave: 'CONTRATO', nombre: 'CONTRATO' },
      { clave: 'CLIENTE', nombre: 'CLIENTE' },
      { clave: 'FECHA DE PROGRAMACIÓN', nombre: 'Fecha Prog.' },
      { clave: 'Operador', nombre: 'Operador' },
      { clave: 'Fecha de Registro', nombre: 'Fecha Registro' },
      { clave: 'Observacion', nombre: 'Observación' },
      { clave: 'ACCION', nombre: '✓' }
    ];

    function mostrarToast(mensaje, tipo = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.textContent = mensaje;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function cargarDatos(silencioso = false) {
      try {
        const perfil = localStorage.getItem('perfil');
        const [resDatos, resListas] = await Promise.all([
          fetch(`${URL_BACKEND}/api/datos?perfil=${perfil}`),
          fetch(`${URL_BACKEND}/api/listas`)
        ]);

        todosLosDatos = await resDatos.json();
        listas = await resListas.json();

        if (!silencioso) {
          generarEncabezados('encabezadoPendientes', 'pendientes');
          generarEncabezados('encabezadoGestionados', 'gestionados');
          generarEncabezados('encabezadoAntiguosPendientes', 'antiguosPendientes');
          generarEncabezados('encabezadoAntiguosGestionados', 'antiguosGestionados');
        }
        renderizarTablas();
      } catch (e) {
        console.error('Error al cargar datos:', e);
      }
    }

    setInterval(() => cargarDatos(true), 10000);

    function cambiarTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('activo'));
      document.querySelectorAll('.tab-contenido').forEach(cont => cont.classList.remove('activo'));

      document.getElementById(`btnTab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('activo');
      document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('activo');
    }

    function generarEncabezados(idFila, tipo) {
      const tr = document.getElementById(idFila);
      tr.innerHTML = '';

      columnas.forEach(col => {
        const th = document.createElement('th');
        if (col.clave === 'ACCION') {
          if (tipo === 'pendientes' || tipo === 'antiguosPendientes') {
            th.innerHTML = `<input type="checkbox" onchange="toggleSeleccionarTodos(this, '${tipo}')">`;
          } else {
            th.textContent = '✓';
          }
        } else {
          th.innerHTML = `
            ${col.nombre}
            <input type="text" class="filtro-columna" placeholder="Filtrar..." 
                   data-clave="${col.clave}" data-tipo="${tipo}" onkeyup="filtrarTabla(event)">
          `;
        }
        tr.appendChild(th);
      });
    }

    function toggleSeleccionarTodos(chkMaster, tipo) {
      const idCuerpo = tipo === 'pendientes' ? '#cuerpoTablaPendientes' : '#cuerpoTablaAntiguosPendientes';
      document.querySelectorAll(`${idCuerpo} .chk-tarea:not(:disabled)`).forEach(chk => {
        chk.checked = chkMaster.checked;
      });
    }

    function filtrarTabla(event) {
      const input = event.target;
      const clave = input.dataset.clave;
      const tipo = input.dataset.tipo;
      const valor = input.value.toLowerCase();

      if (tipo === 'pendientes') filtrosPendientes[clave] = valor;
      else if (tipo === 'gestionados') filtrosGestionados[clave] = valor;
      else if (tipo === 'antiguosPendientes') filtrosAntiguosPendientes[clave] = valor;
      else filtrosAntiguosGestionados[clave] = valor;

      renderizarTablas();
    }

    function aplicarFiltroArray(datos, filtros) {
      return datos.filter(d => {
        return Object.keys(filtros).every(clave => {
          if (!filtros[clave]) return true;
          return aTexto(d[clave]).toLowerCase().includes(filtros[clave]);
        });
      });
    }

    function parsearFecha(fechaStr) {
      if (!fechaStr) return null;
      if (fechaStr instanceof Date) {
        fechaStr.setHours(0, 0, 0, 0);
        return fechaStr;
      }

      const str = String(fechaStr).trim();
      const soloFecha = str.split(' ')[0];
      let f = null;

      if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(soloFecha)) {
        f = new Date(soloFecha);
      } else {
        const partes = soloFecha.split(/[-/]/);
        if (partes.length === 3) {
          const dia = parseInt(partes[0], 10);
          const mes = parseInt(partes[1], 10) - 1;
          let anio = parseInt(partes[2], 10);
          if (anio < 100) anio += 2000;
          f = new Date(anio, mes, dia);
        } else {
          f = new Date(soloFecha);
        }
      }

      if (!f || isNaN(f.getTime())) return null;
      f.setHours(0, 0, 0, 0);
      return f;
    }

    function esMismaFecha(f1, f2) {
      return f1.getFullYear() === f2.getFullYear() && f1.getMonth() === f2.getMonth() && f1.getDate() === f2.getDate();
    }

    function esFechaManana(fechaStr) {
      if (!fechaStr) return false;
      const f = parsearFecha(fechaStr);
      if (!f || isNaN(f.getTime())) return false;

      const manana = new Date();
      manana.setDate(manana.getDate() + 1);
      manana.setHours(0, 0, 0, 0);
      return esMismaFecha(f, manana);
    }

    function esFechaHoyOAnterior(fechaStr) {
      if (!fechaStr) return false;
      const f = parsearFecha(fechaStr);
      if (!f || isNaN(f.getTime())) return false;

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      return f <= hoy;
    }

    function esGestado(d) {
      const obs = (d.Observacion || '').toString().trim().toLowerCase();
      return obs && obs !== 'pendiente' && obs !== '-- seleccionar --';
    }

    function depurarTareasUnicas(listaDatos) {
      const mapaUnicos = new Map();
      listaDatos.forEach(d => {
        const idTarea = String(d.TAREA || '').trim();
        if (!idTarea) return;

        if (!mapaUnicos.has(idTarea)) {
          mapaUnicos.set(idTarea, d);
        } else {
          const existente = mapaUnicos.get(idTarea);
          if (esGestado(d) && !esGestado(existente)) {
            mapaUnicos.set(idTarea, d);
          }
        }
      });
      return Array.from(mapaUnicos.values());
    }

    function renderizarTablas() {
      const presente = todosLosDatos.filter(d => esFechaManana(d['FECHA DE PROGRAMACIÓN']));
      const antiguos = todosLosDatos.filter(d => esFechaHoyOAnterior(d['FECHA DE PROGRAMACIÓN']));

      let pendientes = depurarTareasUnicas(presente.filter(d => !esGestado(d)));
      let gestionados = depurarTareasUnicas(presente.filter(d => esGestado(d)));
      let antiguosPendientes = depurarTareasUnicas(antiguos.filter(d => !esGestado(d)));
      let antiguosGestionados = depurarTareasUnicas(antiguos.filter(d => esGestado(d)));

      document.getElementById('countPendientes').textContent = pendientes.length;
      document.getElementById('countGestionados').textContent = gestionados.length;
      document.getElementById('countAntiguosPendientes').textContent = antiguosPendientes.length;
      document.getElementById('countAntiguosGestionados').textContent = antiguosGestionados.length;

      renderizarCuerpo('cuerpoTablaPendientes', aplicarFiltroArray(pendientes, filtrosPendientes), false);
      renderizarCuerpo('cuerpoTablaGestionados', aplicarFiltroArray(gestionados, filtrosGestionados), true);
      renderizarCuerpo('cuerpoTablaAntiguosPendientes', aplicarFiltroArray(antiguosPendientes, filtrosAntiguosPendientes), false);
      renderizarCuerpo('cuerpoTablaAntiguosGestionados', aplicarFiltroArray(antiguosGestionados, filtrosAntiguosGestionados), true);
    }

    function renderizarCuerpo(idCuerpo, datos, esGestionado) {
      const cuerpo = document.getElementById(idCuerpo);
      cuerpo.innerHTML = '';

      datos.forEach(d => {
        const obsLimpia = (d.Observacion || '').toString().trim();
        const valorObs = (!obsLimpia || obsLimpia.toLowerCase() === 'pendiente') ? '' : obsLimpia;
        const valorOp = d.Operador || '';
        const valorFechaReg = d['Fecha de Registro'] || '';
        const tareaLimpia = aTexto(d.TAREA).replace(/'/g, "\\'");
        const etiquetaNuevo = d.NuevoRegistro ? '<span class="nuevo-registro">Nuevo</span>' : '';

        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td ondblclick="mostrarModal('Tarea', '${tareaLimpia}')" title="Doble clic">${truncarTexto(d.TAREA, 12)} ${etiquetaNuevo}</td>
          <td ondblclick="mostrarModal('Orden', '${aTexto(d.ORDEN).replace(/'/g, "\\'")}')">${truncarTexto(d.ORDEN, 12)}</td>
          <td ondblclick="mostrarModal('Ciudad', '${aTexto(d.CIUDAD).replace(/'/g, "\\'")}')">${truncarTexto(d.CIUDAD, 18)}</td>
          <td ondblclick="mostrarModal('Técnico', '${aTexto(d.TECNICO).replace(/'/g, "\\'")}')">${truncarTexto(d.TECNICO, 15)}</td>
          <td ondblclick="mostrarModal('Contrato', '${aTexto(d.CONTRATO).replace(/'/g, "\\'")}')">${aTexto(d.CONTRATO)}</td>
          <td ondblclick="mostrarModal('Cliente', '${aTexto(d.CLIENTE).replace(/'/g, "\\'")}')">${truncarTexto(d.CLIENTE, 18)}</td>
          <td ondblclick="mostrarModal('Fecha Prog.', '${aTexto(d['FECHA DE PROGRAMACIÓN']).replace(/'/g, "\\'")}')">${truncarTexto(d['FECHA DE PROGRAMACIÓN'], 16)}</td>
          <td ondblclick="mostrarModal('Operador', '${aTexto(valorOp).replace(/'/g, "\\'")}')">${truncarTexto(valorOp, 15)}</td>
          <td ondblclick="mostrarModal('Fecha Registro', '${aTexto(valorFechaReg).replace(/'/g, "\\'")}')">${truncarTexto(valorFechaReg, 15)}</td>
          <td>
            <select class="campo-editar" data-tarea="${tareaLimpia}" ${esGestionado ? 'disabled' : ''}>
              <option value="">-- Seleccionar --</option>
              ${listas.observaciones.map(obs => `<option value="${obs}" ${valorObs === obs ? 'selected' : ''}>${obs}</option>`).join('')}
            </select>
          </td>
          <td style="text-align: center;">
            <input type="checkbox" class="chk-tarea" data-tarea="${tareaLimpia}" ${esGestionado ? 'disabled checked' : ''}>
          </td>
        `;
        cuerpo.appendChild(fila);
      });
    }

    async function guardarSeleccionados() {
      const seleccionados = document.querySelectorAll('.chk-tarea:checked:not(:disabled)');
      if (seleccionados.length === 0) return mostrarToast('Selecciona al menos una tarea.', 'error');

      const listaPayload = [];
      const fechaFormateada = new Date().toLocaleDateString('es-EC', { day: '2-digit', month: 'long', year: 'numeric' });

      for (let chk of seleccionados) {
        const tarea = chk.dataset.tarea;
        const selectObs = document.querySelector(`select[data-tarea="${tarea}"]`);
        const observacion = selectObs ? selectObs.value : '';

        if (!observacion) return mostrarToast(`La tarea "${tarea}" no tiene observación asignada.`, 'error');

        listaPayload.push({ tarea, operador: usuarioLogeado, observacion, fechaRegistro: fechaFormateada });
      }

      try {
        const res = await fetch(`${URL_BACKEND}/api/editar`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(listaPayload)
        });
        const data = await res.json();
        mostrarToast(data.mensaje);
        cargarDatos();
      } catch (error) {
        mostrarToast('Error al guardar los registros.', 'error');
      }
    }

    function truncarTexto(t, max = 25) {
      if (!t) return '';
      const str = String(t);
      return str.length > max ? str.substring(0, max) + '...' : str;
    }

    function aTexto(v) { return v === null || v === undefined ? '' : String(v); }

    function mostrarModal(titulo, texto) {
      document.getElementById('modalTitulo').textContent = titulo;
      document.getElementById('modalTextoContenido').textContent = texto || '(Vacío)';
      document.getElementById('modalTexto').style.display = 'flex';
    }

    function cerrarModal(e) {
      if (!e || e.target === document.getElementById('modalTexto') || e.target.classList.contains('btn-cerrar-modal')) {
        document.getElementById('modalTexto').style.display = 'none';
      }
    }

    function cerrarSesion() { localStorage.clear(); window.location.replace('index.html'); }

    cargarDatos();
  </script>
</body>
</html>
