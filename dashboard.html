<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Tareas — Operador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>📋 Tareas Asignadas</h1>
      <button onclick="cerrarSesion()" class="salir">Salir</button>
    </header>
    
    <div class="filtros">
      <input type="text" id="buscar" placeholder="Buscar por tarea, orden o ciudad...">
    </div>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Tarea (única)</th>
            <th>Orden</th>
            <th>Ciudad</th>
            <th>Operador</th>
            <th>Observación</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </div>

  <script>
    const URL_BACKEND = 'https://tu-backend.onrender.com'; // Tu URL de Render
    let listas = { operadores: [], observaciones: [] };

    async function cargarDatos() {
      const perfil = localStorage.getItem('perfil');
      const horaInicio = localStorage.getItem('horaInicio');
      
      const [resDatos, resListas] = await Promise.all([
        fetch(`${URL_BACKEND}/api/datos?perfil=${perfil}&horaInicio=${horaInicio}`),
        fetch(`${URL_BACKEND}/api/listas`)
      ]);

      const datos = await resDatos.json();
      listas = await resListas.json();
      renderizarTabla(datos);
    }

    function renderizarTabla(datos) {
      const cuerpo = document.getElementById('cuerpoTabla');
      cuerpo.innerHTML = '';
      
      datos.forEach(d => {
        const fila = document.createElement('tr');
        fila.style.backgroundColor = d.color;
        fila.innerHTML = `
          <td>${d.tarea}</td>
          <td>${d.orden || ''}</td>
          <td>${d.ciudad || ''}</td>
          <td>
            <select class="campo-editar" data-tarea="${d.tarea}" data-campo="operador">
              ${listas.operadores.map(op => `<option ${d.operador===op?'selected':''}>${op}</option>`).join('')}
            </select>
          </td>
          <td>
            <select class="campo-editar" data-tarea="${d.tarea}" data-campo="observacion">
              ${listas.observaciones.map(obs => `<option ${d.observacion===obs?'selected':''}>${obs}</option>`).join('')}
            </select>
          </td>
          <td><button class="guardar" data-tarea="${d.tarea}">✓</button></td>
        `;
        cuerpo.appendChild(fila);
      });

      // Eventos
      document.querySelectorAll('.guardar').forEach(btn => {
        btn.onclick = async e => {
          const tarea = e.target.dataset.tarea;
          const operador = document.querySelector(`select[data-tarea="${tarea}"][data-campo="operador"]`).value;
          const observacion = document.querySelector(`select[data-tarea="${tarea}"][data-campo="observacion"]`).value;
          
          await fetch(`${URL_BACKEND}/api/editar`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tarea, operador, observacion })
          });
          alert('Guardado ✓');
        };
      });
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    cargarDatos();
  </script>
</body>
</html>
