<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tareas — Operador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Modal para ver texto completo -->
  <div id="modalTexto" class="modal-texto" onclick="cerrarModal(event)">
    <div class="modal-contenido" onclick="event.stopPropagation()">
      <h4 id="modalTitulo"></h4>
      <p id="modalTextoContenido"></p>
      <button class="modal-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <div class="contenedor">
    <header>
      <h1>📋 Tareas Asignadas</h1>
      <button onclick="cerrarSesion()" class="salir">Salir</button>
    </header>
    <div class="filtros">
      <input type="text" id="buscar" placeholder="Buscar...">
    </div>
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>TAREA</th>
            <th>ORDEN</th>
            <th>CIUDAD</th>
            <th>TÉCNICO</th>
            <th>CONTRATO</th>
            <th>CLIENTE</th>
            <th>Fecha Prog.</th>
            <th>Operador</th>
            <th>Observación</th>
            <th>✓</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </div>

  <script>
    const URL_BACKEND = 'https://confirmacion-previa-backend.onrender.com';
    let listas = { operadores: [], observaciones: [] };
    let todosLosDatos = [];

    async function cargarDatos() {
      const perfil = localStorage.getItem('perfil');
      const horaInicio = localStorage.getItem('horaInicio');
      
      const [resDatos, resListas] = await Promise.all([
        fetch(`${URL_BACKEND}/api/datos?perfil=${perfil}&horaInicio=${horaInicio}`),
        fetch(`${URL_BACKEND}/api/listas`)
      ]);
      
      todosLosDatos = await resDatos.json();
      listas = await resListas.json();
      renderizarTabla(todosLosDatos);
    }

    // Función para truncar texto largo
    function truncarTexto(texto, maxCaracteres = 25) {
      if (!texto) return '';
      const t = String(texto);
      return t.length > maxCaracteres ? t.substring(0, maxCaracteres) + '...' : t;
    }

    // Convierte cualquier valor a texto de forma segura
function aTexto(valor) {
  if (valor === null || valor === undefined) return '';
  return String(valor);
}

    // Mostrar modal con texto completo
    function mostrarModal(titulo, textoCompleto) {
      document.getElementById('modalTitulo').textContent = titulo;
      document.getElementById('modalTextoContenido').textContent = textoCompleto || '(Vacío)';
      document.getElementById('modalTexto').style.display = 'flex';
    }

    function cerrarModal(event) {
      if (!event || event.target === document.getElementById('modalTexto')) {
        document.getElementById('modalTexto').style.display = 'none';
      }
    }

function renderizarTabla(datos) {
  const cuerpo = document.getElementById('cuerpoTabla');
  cuerpo.innerHTML = '';
  
  datos.forEach(d => {
    const valorObs = d.Observacion || 'Pendiente';
    const fila = document.createElement('tr');
    fila.style.backgroundColor = d.color;
    fila.innerHTML = `
      <td class="texto-corto" ondblclick="mostrarModal('Tarea', '${aTexto(d.TAREA).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.TAREA, 12)}</td>
      <td class="texto-corto" ondblclick="mostrarModal('Orden', '${aTexto(d.ORDEN).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.ORDEN, 12)}</td>
      <td class="texto-corto" ondblclick="mostrarModal('Ciudad', '${aTexto(d.CIUDAD).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.CIUDAD, 22)}</td>
      <td class="texto-corto" ondblclick="mostrarModal('Técnico', '${aTexto(d.TECNICO).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d.TECNICO, 15)}</td>
      <td class="texto-corto" ondblclick="mostrarModal('Contrato', '${aTexto(d.CONTRATO).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${aTexto(d.CONTRATO)}</td>
      <td class="texto-corto" ondblclick="mostrarModal('Cliente', '${aTexto(d.CLIENTE).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${aTexto(d.CLIENTE)}</td>
      <td class="texto-corto" ondblclick="mostrarModal('Fecha de Programación', '${aTexto(d['FECHA DE PROGRAMACIÓN']).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${truncarTexto(d['FECHA DE PROGRAMACIÓN'], 12)}</td>          <option value="">--</option>
          ${listas.operadores.map(op => 
            `<option ${(aTexto(d.Operador)) === op ? 'selected' : ''}>${op}</option>`
          ).join('')}
        </select>
      </td>
      <td ondblclick="mostrarModal('Observación', '${aTexto(valorObs).replace(/'/g, "\\'")}')" title="Doble clic para ver completo">
        <select class="campo-editar" data-tarea="${aTexto(d.TAREA).replace(/'/g, "\\'")}" data-campo="observacion">
          <option value="">--</option>
          ${listas.observaciones.map(obs => 
            `<option ${valorObs === obs ? 'selected' : ''}>${obs}</option>`
          ).join('')}
        </select>
      </td>
      <td style="text-align:center" ondblclick="mostrarModal('Lote', '${aTexto(d.lote != null ? d.lote + 1 : '').replace(/'/g, "\\'")}')" title="Doble clic para ver completo">${d.lote + 1}</td>
      <td ondblclick="mostrarModal('Acción', 'Botón de guardar')" title="Doble clic para ver completo">
        <button class="guardar" data-tarea="${aTexto(d.TAREA).replace(/'/g, "\\'")}">✓</button>
      </td>
    `;
    cuerpo.appendChild(fila);
  });
  asignarEventosGuardado();
}

    function asignarEventosGuardado() {
      document.querySelectorAll('.guardar').forEach(btn => {
        btn.onclick = async e => {
          const tarea = e.target.dataset.tarea;
          const operador = document.querySelector(`select[data-tarea="${tarea}"][data-campo="operador"]`).value;
          const observacion = document.querySelector(`select[data-tarea="${tarea}"][data-campo="observacion"]`).value;
          
          await fetch(`${URL_BACKEND}/api/editar`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tarea, operador, observacion })
          });
          
          alert('✅ Guardado');
        };
      });
    }

    document.getElementById('buscar').addEventListener('input', e => {
      const texto = e.target.value.toLowerCase();
      const filtrados = todosLosDatos.filter(d =>
        Object.values(d).some(v => v && String(v).toLowerCase().includes(texto))
      );
      renderizarTabla(filtrados);
    });

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    cargarDatos();
  </script>
</body>
</html>
